name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show what is being built
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          Write-Host "Building version=$($pkg.version)"
          Select-String -Path index.html -Pattern "<title>.*</title>"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows Setup and Portable EXE
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPC-SHI-2.0-Windows-run${{ github.run_number }}
          path: |
            dist/*.exe
            dist-installer/*.exe
          if-no-files-found: ignore

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist-installer/*.exe

